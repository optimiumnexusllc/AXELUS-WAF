# AXELUS-WAF — Admin Frontend Nginx Config
# Serves the AXELUS UI and proxies /api/ to axelus-mgt:1443
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    server_tokens off;

    # Proxy all /api/* → axelus-mgt internal port 1443 (SSL)
    location /api/ {
        proxy_pass         https://axelus-mgt:1443/api/;
        proxy_ssl_verify   off;
        proxy_set_header   Host axelus-mgt;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Serve SPA — all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
