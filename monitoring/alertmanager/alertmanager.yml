global:
  resolve_timeout: 5m
  slack_api_url: '${ALERT_SLACK_WEBHOOK}'
  smtp_smarthost: '${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT}'
  smtp_from: '${ALERT_SMTP_FROM}'
  smtp_auth_username: '${ALERT_SMTP_USER}'
  smtp_auth_password: '${ALERT_SMTP_PASSWORD}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'slack-default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical-all'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-default'

receivers:
  - name: 'slack-default'
    slack_configs:
      - channel: '${ALERT_SLACK_CHANNEL}'
        send_resolved: true
        title: '{{ template "slack.axelus.title" . }}'
        text: '{{ template "slack.axelus.text" . }}'
        color: '{{ if eq .Status "firing" }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  - name: 'critical-all'
    slack_configs:
      - channel: '${ALERT_SLACK_CHANNEL}'
        send_resolved: true
        title: '🚨 CRITICAL: {{ template "slack.axelus.title" . }}'
        text: '{{ template "slack.axelus.text" . }}'
        color: 'danger'
    pagerduty_configs:
      - routing_key: '${ALERT_PAGERDUTY_INTEGRATION_KEY}'
        description: '{{ template "pagerduty.axelus.description" . }}'
    email_configs:
      - to: '${ALERT_SMTP_TO}'
        subject: '🚨 AXELUS CRITICAL Alert: {{ .GroupLabels.alertname }}'
        html: '{{ template "email.axelus.html" . }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
