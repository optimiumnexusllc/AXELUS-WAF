apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: axelus-prometheus
    access: proxy
    url: http://axelus-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST

  - name: PostgreSQL
    type: postgres
    uid: axelus-postgres
    url: axelus-postgres:5432
    database: axelus
    user: axelus
    editable: false
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      postgresVersion: 1500
      timescaledb: false

  - name: Loki
    type: loki
    uid: axelus-loki
    access: proxy
    url: http://axelus-loki:3100
    editable: false
    jsonData:
      maxLines: 1000
