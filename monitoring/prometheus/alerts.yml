groups:
  - name: axelus.core
    rules:
      - alert: AXELUSHighAttackRate
        expr: rate(axelus_attacks_blocked_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High attack rate detected"
          description: "AXELUS is blocking more than 100 attacks/sec for 2+ minutes (current: {{ $value }}/sec)"

      - alert: AXELUSCriticalAttackRate
        expr: rate(axelus_attacks_blocked_total[5m]) > 500
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical attack rate — possible DDoS"
          description: "AXELUS is blocking {{ $value }}/sec attacks. Potential DDoS in progress."

      - alert: AXELUSMgtDown
        expr: up{job="axelus-mgt"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AXELUS management API is down"
          description: "The management API has been unreachable for more than 1 minute."

      - alert: AXELUSPostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AXELUS PostgreSQL is down"
          description: "The database is unreachable. WAF configuration changes are disabled."

      - alert: AXELUSHighErrorRate
        expr: rate(axelus_requests_total{status=~"5.."}[5m]) / rate(axelus_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High upstream error rate"
          description: "More than 5% of proxied requests are returning 5xx errors."

      - alert: AXELUSThreatIntelFeedStale
        expr: time() - axelus_threat_intel_last_update_timestamp > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Threat intelligence feed is stale"
          description: "The threat intelligence feed has not been updated in over 2 hours."

      - alert: AXELUSDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on AXELUS data volume"
          description: "Less than 15% disk space remaining on /data."
