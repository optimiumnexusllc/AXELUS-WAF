global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'axelus'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # AXELUS management API metrics
  - job_name: 'axelus-mgt'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['172.22.222.4:1443']
    metrics_path: /api/open/metrics

  # Tengine/Nginx exporter
  - job_name: 'axelus-nginx'
    static_configs:
      - targets: ['axelus-nginx-exporter:9113']

  # PostgreSQL exporter
  - job_name: 'axelus-postgres'
    static_configs:
      - targets: ['axelus-postgres-exporter:9187']

  # Redis exporter
  - job_name: 'axelus-redis'
    static_configs:
      - targets: ['axelus-redis-exporter:9121']

  # Threat Intel service
  - job_name: 'axelus-threat-intel'
    static_configs:
      - targets: ['axelus-threat-intel:9200']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
