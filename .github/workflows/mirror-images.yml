name: Mirror Docker Images — chaitin/safeline-* → optimiumnexusllc/axelus-*

# Publisher: OPTIMIUM NEXUS LLC — https://www.optimiumnexus.com
#
# REQUIRED SECRETS (Settings → Secrets → Actions):
#   DOCKER_USERNAME = optimiumnexusllc
#   DOCKER_TOKEN    = Docker Hub Access Token (Read & Write)
#   Create token at: https://hub.docker.com/settings/security

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — tag but do NOT push'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  SRC_ORG: chaitin
  DST_ORG: optimiumnexusllc

jobs:

  check-secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Verify Docker Hub secrets exist
        id: check
        run: |
          MISSING=""
          [[ -z "${{ secrets.DOCKER_USERNAME }}" ]] && MISSING="DOCKER_USERNAME "
          [[ -z "${{ secrets.DOCKER_TOKEN }}"   ]] && MISSING="${MISSING}DOCKER_TOKEN"
          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing secrets: ${MISSING}"
            echo "::error::Add them at: Settings -> Secrets and variables -> Actions"
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "ok=true" >> $GITHUB_OUTPUT
          echo "Secrets OK"

  mirror:
    name: Mirror ${{ matrix.dst }}
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.ok == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - src: chaitin/safeline-postgres:15.2
            dst: optimiumnexusllc/axelus-postgres:15.2
          - src: chaitin/safeline-postgres:15.2
            dst: optimiumnexusllc/axelus-postgres:latest
          - src: chaitin/safeline-mgt:latest
            dst: optimiumnexusllc/axelus-mgt:latest
          - src: chaitin/safeline-tengine:latest
            dst: optimiumnexusllc/axelus-tengine:latest
          - src: chaitin/safeline-detector:latest
            dst: optimiumnexusllc/axelus-detector:latest
          - src: chaitin/safeline-fvm:latest
            dst: optimiumnexusllc/axelus-fvm:latest
          - src: chaitin/safeline-luigi:latest
            dst: optimiumnexusllc/axelus-luigi:latest
          - src: chaitin/safeline-chaos:latest
            dst: optimiumnexusllc/axelus-chaos:latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull ${{ matrix.src }}
        run: |
          docker pull "${{ matrix.src }}"
          docker inspect --format='Digest: {{index .RepoDigests 0}}' "${{ matrix.src }}" || true

      - name: Tag as ${{ matrix.dst }}
        run: docker tag "${{ matrix.src }}" "${{ matrix.dst }}"

      - name: Push ${{ matrix.dst }}
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: docker push "${{ matrix.dst }}"

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "::notice::DRY RUN — ${{ matrix.dst }} NOT pushed"

  update-compose:
    name: Update compose files
    runs-on: ubuntu-latest
    needs: mirror
    if: ${{ needs.mirror.result == 'success' && github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace image prefix
        run: |
          sed -i 's|image: chaitin/safeline-|image: optimiumnexusllc/axelus-|g' docker-compose.poc.yml
          sed -i 's/^IMAGE_PREFIX=chaitin/IMAGE_PREFIX=optimiumnexusllc/' .env.example
          grep "image:" docker-compose.poc.yml | head -10

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add docker-compose.poc.yml .env.example
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: use optimiumnexusllc/axelus-* images [$(date -u +%Y-%m-%d)] [skip ci]"
          git push

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [check-secrets, mirror, update-compose]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## AXELUS-WAF Mirror — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Secrets | ${{ needs.check-secrets.result }} |"
            echo "| Mirror  | ${{ needs.mirror.result }} |"
            echo "| Compose | ${{ needs.update-compose.result }} |"
          } >> $GITHUB_STEP_SUMMARY
