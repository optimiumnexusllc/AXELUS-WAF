# IronWall - Monitoring Stack
# Usage: docker compose -f compose.yaml -f compose.monitoring.yaml up -d

networks:
  safeline-ce:
    external: true

services:
  prometheus:
    container_name: ironwall-prometheus
    image: prom/prometheus:v2.50.1
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ironwall-prometheus-data:/prometheus
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.20
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    container_name: ironwall-grafana
    image: grafana/grafana:10.4.0
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ironwall_grafana}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://%(domain)s/grafana/
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel,grafana-piechart-panel
    volumes:
      - ironwall-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.21
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  alertmanager:
    container_name: ironwall-alertmanager
    image: prom/alertmanager:v0.27.0
    restart: always
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ironwall-alertmanager-data:/alertmanager
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.22
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Nginx exporter — exposes Tengine/Nginx metrics to Prometheus
  nginx-exporter:
    container_name: ironwall-nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.1.0
    restart: always
    command:
      - '-nginx.scrape-uri=http://${SUBNET_PREFIX}.4:8080/nginx_status'
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.23
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL exporter
  postgres-exporter:
    container_name: ironwall-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://safeline-ce:${POSTGRES_PASSWORD}@${SUBNET_PREFIX}.2:5432/safeline-ce?sslmode=disable
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.24
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ironwall-prometheus-data:
    name: ironwall-prometheus-data
  ironwall-grafana-data:
    name: ironwall-grafana-data
  ironwall-alertmanager-data:
    name: ironwall-alertmanager-data
