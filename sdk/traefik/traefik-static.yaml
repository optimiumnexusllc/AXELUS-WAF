# Traefik v3 Static Configuration — IronWall-WAF Integration
# Publisher: OPTIMIUM NEXUS LLC — https://www.optimiumnexus.com
# Place at: /etc/traefik/traefik.yaml

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        options: ironwall-strict
    http3: {}

certificatesResolvers:
  letsencrypt:
    acme:
      email: contact@optimiumnexus.com
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
  docker:
    exposedByDefault: false
    network: safeline-ce

experimental:
  plugins:
    ironwall-waf:
      moduleName: github.com/optimiumnexusllc/ironwall-traefik
      version: v1.0.0

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
      names:
        X-IronWall-Blocked: keep
        X-IronWall-Block-Reason: keep
        X-IronWall-Country: keep
        X-IronWall-Threat-Score: keep

metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5]

tracing:
  serviceName: traefik-ironwall
  sampleRate: 0.1

ping: {}
