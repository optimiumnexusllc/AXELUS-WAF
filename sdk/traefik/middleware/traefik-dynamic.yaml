# AXELUS-WAF — Traefik v3 Dynamic Configuration
# Publisher: OPTIMIUM NEXUS LLC — https://www.optimiumnexus.com
#
# Static config (traefik.yaml) must declare:
#   experimental:
#     plugins:
#       axelus-waf:
#         moduleName: github.com/optimiumnexusllc/axelus-traefik
#         version: v1.0.0

http:

  # ── Middlewares ──────────────────────────────────────────────────────────────
  middlewares:

    # ── Full AXELUS stack (ULTIMATE — all checks) ───────────────────────────
    axelus-full:
      plugin:
        axelus-waf:
          axelusUrl: "https://axelus-mgt:9443"
          adminKey: "${IRONWALL_ADMIN_KEY}"
          timeoutMs: 50
          geoipEnabled: true
          threatIntelEnabled: true
          dpiEnabled: true
          rateLimitEnabled: true
          honeypotEnabled: true
          inspectBody: true
          blockStatus: 403
          failOpen: true
          maxBodyBytes: 1048576

    # ── Lightweight (PROFESSIONAL — GeoIP + rate limit only) ─────────────────
    axelus-lite:
      plugin:
        axelus-waf:
          axelusUrl: "https://axelus-mgt:9443"
          adminKey: "${IRONWALL_ADMIN_KEY}"
          timeoutMs: 30
          geoipEnabled: true
          threatIntelEnabled: false
          dpiEnabled: false
          rateLimitEnabled: true
          honeypotEnabled: false
          inspectBody: false
          blockStatus: 403
          failOpen: true

    # ── API gateway mode (DPI + rate limit, no GeoIP) ────────────────────────
    axelus-api:
      plugin:
        axelus-waf:
          axelusUrl: "https://axelus-mgt:9443"
          adminKey: "${IRONWALL_ADMIN_KEY}"
          timeoutMs: 75
          geoipEnabled: false
          threatIntelEnabled: true
          dpiEnabled: true
          rateLimitEnabled: true
          honeypotEnabled: false
          inspectBody: true
          blockStatus: 429
          failOpen: false        # API gateway: fail-closed for security

    # ── Security headers ──────────────────────────────────────────────────────
    axelus-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "geolocation=(), camera=(), microphone=()"
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'nonce-{nonce}';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:;
          frame-ancestors 'none';
        customResponseHeaders:
          X-WAF-Provider: "AXELUS-WAF"
          X-Publisher: "OPTIMIUM NEXUS LLC"
          Server: ""
          X-Powered-By: ""

    # ── Rate limiting (Traefik native, complementary) ─────────────────────────
    axelus-ratelimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1
            excludedIPs: ["127.0.0.1/32"]

    # ── Compression ───────────────────────────────────────────────────────────
    axelus-compress:
      compress:
        excludedContentTypes:
          - text/event-stream
        minResponseBodyBytes: 1024

    # ── Full chain (AXELUS + headers + compress) ────────────────────────────
    axelus-chain-full:
      chain:
        middlewares:
          - axelus-full
          - axelus-headers
          - axelus-compress

    axelus-chain-api:
      chain:
        middlewares:
          - axelus-api
          - axelus-headers

  # ── Routers ──────────────────────────────────────────────────────────────────
  routers:

    # Public web — full WAF protection
    public-https:
      rule: "Host(`example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["axelus-chain-full"]
      service: public-backend
      tls:
        certResolver: letsencrypt

    # API gateway — API-mode WAF
    api-gateway:
      rule: "Host(`api.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["axelus-chain-api"]
      service: api-backend
      tls:
        certResolver: letsencrypt

    # Admin panel — full WAF + IP restriction
    admin-panel:
      rule: "Host(`admin.example.com`) && PathPrefix(`/`)"
      entryPoints: ["websecure"]
      middlewares: ["axelus-chain-full"]
      service: admin-backend
      tls:
        certResolver: letsencrypt
      priority: 100

    # AXELUS dashboard itself — internal only
    axelus-dashboard:
      rule: "Host(`waf.internal.example.com`)"
      entryPoints: ["websecure"]
      service: axelus-mgt
      tls: {}

    # HTTP → HTTPS redirect
    http-redirect:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints: ["web"]
      middlewares: ["https-redirect"]
      service: noop

  # ── Services ──────────────────────────────────────────────────────────────────
  services:

    public-backend:
      loadBalancer:
        servers:
          - url: "http://public-backend:3000"
          - url: "http://public-backend-2:3000"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"
        sticky:
          cookie:
            name: axelus_lb
            secure: true
            httpOnly: true

    api-backend:
      loadBalancer:
        servers:
          - url: "http://api-backend:8080"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"
        passHostHeader: true

    admin-backend:
      loadBalancer:
        servers:
          - url: "http://admin-backend:8080"

    axelus-mgt:
      loadBalancer:
        servers:
          - url: "https://axelus-mgt:9443"
        serversTransport: axelus-transport

    noop:
      loadBalancer:
        servers:
          - url: "http://noop"

  # ── Server Transports (mTLS to AXELUS) ──────────────────────────────────
  serversTransports:
    axelus-transport:
      serverName: "management.axelus.svc.cluster.local"
      insecureSkipVerify: false
      rootCAs:
        - "/etc/axelus/certs/ca.crt"
      certificates:
        - certFile: "/etc/axelus/certs/traefik/cert.pem"
          keyFile:  "/etc/axelus/certs/traefik/key.pem"
      maxIdleConnsPerHost: 10
      forwardingTimeouts:
        dialTimeout: "5s"
        responseHeaderTimeout: "60s"

  # ── Additional middlewares ────────────────────────────────────────────────
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

# ── TLS ────────────────────────────────────────────────────────────────────────
tls:
  options:
    axelus-strict:
      minVersion: VersionTLS13
      curvePreferences:
        - X25519
        - CurveP256
      sniStrict: true

  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: "example.com"
          sans: ["*.example.com"]
