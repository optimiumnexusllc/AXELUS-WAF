[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ironwall-sdk"
version = "1.0.0"
description = "IronWall-WAF Python SDK — License validation and feature gating"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OPTIMIUM NEXUS LLC", email = "contact@optimiumnexus.com" }
]
keywords = ["waf", "firewall", "security", "license", "ironwall"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = []  # Zero mandatory dependencies — pure stdlib

[project.optional-dependencies]
django   = ["django>=3.2"]
fastapi  = ["fastapi>=0.100", "httpx>=0.24"]
flask    = ["flask>=2.0"]
requests = ["requests>=2.28"]
all      = ["django>=3.2", "fastapi>=0.100", "flask>=2.0", "requests>=2.28"]

[project.urls]
Homepage      = "https://www.optimiumnexus.com"
Documentation = "https://www.optimiumnexus.com/docs/sdk/python"
Repository    = "https://github.com/optimiumnexusllc/IronWAll-WAF"
Issues        = "https://github.com/optimiumnexusllc/IronWAll-WAF/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ironwall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
