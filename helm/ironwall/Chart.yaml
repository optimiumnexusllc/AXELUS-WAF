apiVersion: v2
name: axelus
description: AXELUS — Enterprise-Grade Web Application Firewall
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/optimiumnexusllc/AXELUS
sources:
  - https://github.com/optimiumnexusllc/AXELUS
maintainers:
  - name: OptiumNexus LLC
    url: https://github.com/optimiumnexusllc
keywords:
  - waf
  - firewall
  - security
  - nginx
  - owasp
dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: "25.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "7.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
